server:
  port: 8086

spring:
  application:
    name: verification-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  gateway:
    shared-secret: ${GATEWAY_SHARED_SECRET:dev-only-insecure-shared-secret-change-me}
  face:
    service-url: ${FACE_SERVICE_URL:http://localhost:8002}
    dev-bypass: ${FACE_DEV_BYPASS:false}
  identity:
    # The Home Affairs photo on the citizen's record that a live face scan
    # gets compared against — see IdentityServiceClient.
    service-url: ${IDENTITY_SERVICE_URL:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  level:
    com.dha.verification: DEBUG
