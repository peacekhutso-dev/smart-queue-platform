server:
  port: 8085

spring:
  application:
    name: identity-service
  # Citizen ID photos (dev Citizen Records tool) are up to 5MB; Spring's
  # default 1MB multipart limit would reject most phone photos.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:identity_db}?useSSL=false&serverTimezone=Africa/Johannesburg&allowPublicKeyRetrieval=true
    username: ${DB_USER:identity_user}
    password: ${DB_PASS:identitypassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  gateway:
    shared-secret: ${GATEWAY_SHARED_SECRET:dev-only-insecure-shared-secret-change-me}
  jwt:
    expiry: ${JWT_EXPIRY:86400000}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
  otp:
    expiry-minutes: 5
    length: 6
    # Dev-only: no SMS/email provider is wired up here, so with OTP logging
    # also removed for security, there's no way to complete 2FA locally
    # without this or reading Redis directly. Must stay false anywhere real.
    dev-expose-otp: ${OTP_DEV_EXPOSE:false}
  password-reset:
    expiry-minutes: 15
  zero-trust:
    two-fa-ttl-hours: ${TWO_FA_TTL_HOURS:8}
    fingerprint-ttl-hours: ${FINGERPRINT_SESSION_TTL_HOURS:4}
    # Gate 1.5: login confirms SA ID + name against the seeded Home Affairs
    # record (see AuthService.confirmIdentity / CitizenRecordSeeder).
    identity-confirm-ttl-hours: ${IDENTITY_CONFIRM_TTL_HOURS:8}
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID:localhost}
    rp-name: DHA Smart Queue Admin
    origins: ${WEBAUTHN_ORIGINS:http://localhost:8443,http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  level:
    com.dha.identity: DEBUG
    org.hibernate.SQL: WARN
