server:
  port: 8085

spring:
  application:
    name: identity-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:identity_db}?useSSL=false&serverTimezone=Africa/Johannesburg&allowPublicKeyRetrieval=true
    username: ${DB_USER:identity_user}
    password: ${DB_PASS:identitypassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

app:
  jwt:
    expiry: ${JWT_EXPIRY:86400000}
  otp:
    expiry-minutes: 5
    length: 6
  password-reset:
    expiry-minutes: 15
  zero-trust:
    two-fa-ttl-hours: ${TWO_FA_TTL_HOURS:8}
    fingerprint-ttl-hours: ${FINGERPRINT_SESSION_TTL_HOURS:4}
  webauthn:
    rp-id: ${WEBAUTHN_RP_ID:localhost}
    rp-name: DHA Smart Queue Admin
    origins: ${WEBAUTHN_ORIGINS:http://localhost:8443,http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  level:
    com.dha.identity: DEBUG
    org.hibernate.SQL: WARN
