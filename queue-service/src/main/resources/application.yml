server:
  port: 8088

spring:
  application:
    name: queue-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:queue_db}?useSSL=false&serverTimezone=Africa/Johannesburg&allowPublicKeyRetrieval=true
    username: ${DB_USER:queue_user}
    password: ${DB_PASS:queuepassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

app:
  # Branch config (capacity/counters/service time/name/address) changes rarely,
  # so this stays a direct synchronous call rather than an event-fed cache —
  # unlike the live queue counts branch-service needs from this service, which
  # change constantly (see BranchClient / RabbitMQConfig).
  branch-service:
    url: ${BRANCH_SERVICE_URL:http://localhost:8087}
  identity-service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8085}
  # Required-documents check on joinQueue — see CatalogClient/DocumentClient.
  catalog-service:
    url: ${CATALOG_SERVICE_URL:http://localhost:8091}
  queue:
    # Dev-only: the required-documents gate on joinQueue depends on a
    # document-type-extraction model that isn't built yet, so it currently
    # blocks every booking that needs documents. Skips requireDocumentsOnFile
    # entirely while that's in progress, so citizens can still reach upload +
    # booking; verification happens manually at the branch instead (see
    # "Documents are pre-validated. Final approval at the branch." copy on
    # the frontend). Never true in a real deployment.
    skip-document-check: ${QUEUE_SKIP_DOCUMENT_CHECK:false}
  document-service:
    url: ${DOCUMENT_SERVICE_URL:http://localhost:8089}
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8001}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  gateway:
    shared-secret: ${GATEWAY_SHARED_SECRET:dev-only-insecure-shared-secret-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  level:
    com.dha.queue: DEBUG
    org.hibernate.SQL: WARN
