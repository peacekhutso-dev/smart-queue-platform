server:
  port: 8089

spring:
  application:
    name: document-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:document_db}?useSSL=false&serverTimezone=Africa/Johannesburg&allowPublicKeyRetrieval=true
    username: ${DB_USER:document_user}
    password: ${DB_PASS:documentpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  # Image quality assessment (blur/brightness/glare) — service-to-service,
  # not through the Gateway. Fails open if unreachable (see MlServiceClient).
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8001}
  document:
    # Dev-only: skips the AI classification/quality gate entirely so every
    # upload lands as VALID/IN_REVIEW without calling ml-service at all.
    # Never set true in a real deployment.
    skip-ml-check: ${DOCUMENT_SKIP_ML_CHECK:false}
  gateway:
    shared-secret: ${GATEWAY_SHARED_SECRET:dev-only-insecure-shared-secret-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  level:
    com.dha.document: DEBUG
    org.hibernate.SQL: WARN
