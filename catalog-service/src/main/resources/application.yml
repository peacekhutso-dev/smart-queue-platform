server:
  port: 8091

spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:catalog_db}?useSSL=false&serverTimezone=Africa/Johannesburg&allowPublicKeyRetrieval=true
    username: ${DB_USER:catalog_user}
    password: ${DB_PASS:catalogpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

app:
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  gateway:
    shared-secret: ${GATEWAY_SHARED_SECRET:dev-only-insecure-shared-secret-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  level:
    com.dha.catalog: DEBUG
    org.hibernate.SQL: WARN
